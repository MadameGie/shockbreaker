<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
    }

    button {
      padding: 10px;
      margin-right: 5px;
    }
  </style>
</head>

<body>

<div id="ui">
  <button onclick="enterVR()">ENTER VR</button>
</div>

<a-scene
  id="scene"
  webxr="optionalFeatures: local-floor, bounded-floor;"
  vr-mode-ui="enabled: true"
  device-orientation-permission-ui="enabled: true"
>

  <!-- CAMERA (GYRO + VR HEAD TRACKING) -->
  <a-entity id="rig" position="0 0 0">
    <a-camera id="camera" position="0 1.6 0" look-controls wasd-controls></a-camera>
  </a-entity>

  <!-- LIGHT -->
  <a-light type="ambient" intensity="2"></a-light>
  <a-light type="directional" intensity="3" position="1 2 1"></a-light>

  <!-- FLOOR -->
  <a-plane rotation="-90 0 0" width="50" height="50" color="#444"></a-plane>

  <!-- MODEL -->
  <a-entity position="0 0 -3" scale="1 1 1">
    <a-gltf-model src="scene.glb"></a-gltf-model>
  </a-entity>

</a-scene>

<script>
let rig = document.querySelector('#rig');
let walking = false;

// masuk VR
function enterVR() {
  const scene = document.querySelector('#scene');
  scene.enterVR();
}

// TOUCH CONTROL = JALAN MAJU
document.addEventListener('touchstart', () => {
  walking = true;
});

document.addEventListener('touchend', () => {
  walking = false;
});

// gerakan maju
function tick() {
  if (walking) {
    let pos = rig.getAttribute('position');
    let camera = document.querySelector('#camera');

    let dir = new THREE.Vector3();
    camera.object3D.getWorldDirection(dir);

    pos.x -= dir.x * 0.03;
    pos.z -= dir.z * 0.03;

    rig.setAttribute('position', pos);
  }

  requestAnimationFrame(tick);
}

tick();
</script>

</body>
</html>
