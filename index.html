<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin:0; overflow:hidden; }

    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 999;
    }

    button {
      padding: 10px;
      margin-right: 5px;
    }
  </style>
</head>

<body>

<div id="ui">
  <button onclick="setMode('ar')">AR MODE</button>
  <button onclick="setMode('vr')">VR MODE</button>
</div>

<a-scene
  id="scene"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true"
>

  <!-- CAMERA (WAJIB) -->
  <a-camera id="camera" position="0 0 0"></a-camera>

  <!-- LIGHT -->
  <a-light type="ambient" intensity="2"></a-light>
  <a-light type="directional" intensity="3" position="1 2 1"></a-light>

  <!-- ================= AR ROOT ================= -->
  <a-entity id="arRoot"
    mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
  >

    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity position="0 0.2 0" scale="0.005 0.005 0.005">
        <a-gltf-model src="scene.glb" rotation="0 180 0"></a-gltf-model>
      </a-entity>

    </a-entity>

  </a-entity>

  <!-- ================= VR ROOT ================= -->
  <a-entity id="vrRoot" visible="false">

    <!-- gyro camera rig -->
    <a-entity id="rig" look-controls>

      <a-entity position="0 0 -2">
        <a-gltf-model src="scene.glb" scale="1 1 1"></a-gltf-model>
      </a-entity>

    </a-entity>

  </a-entity>

</a-scene>

<script>
function setMode(mode) {

  const arRoot = document.getElementById('arRoot');
  const vrRoot = document.getElementById('vrRoot');

  if (mode === 'ar') {
    arRoot.setAttribute('mindar-image', 'autoStart: true');
    arRoot.setAttribute('visible', true);
    vrRoot.setAttribute('visible', false);
  }

  if (mode === 'vr') {
    arRoot.setAttribute('mindar-image', 'autoStart: false');
    arRoot.setAttribute('visible', false);
    vrRoot.setAttribute('visible', true);
  }
}
</script>

</body>
</html>
