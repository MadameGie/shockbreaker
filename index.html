<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>MindAR WebAR</title>

  <!-- MindAR + A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #ar-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    /* Hide loading UI default A-Frame */
    .a-loader-title {
      display: none !important;
    }
  </style>
</head>

<body>

<div id="ar-container">
  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >

    <!-- Camera -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- LIGHT -->
    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" intensity="1" position="1 1 1"></a-light>

    <!-- MARKER TARGET -->
<a-entity mindar-image-target="targetIndex: 0">

  <a-box position="0 0 0" scale="0.5 0.5 0.5" color="green"></a-box>

  <a-entity position="0 0.3 0" scale="8 8 8">
    <a-gltf-model src="scene.glb"></a-gltf-model>
  </a-entity>

</a-entity>

</a-entity>

  </a-scene>
</div>

</body>
</html>
