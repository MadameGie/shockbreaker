<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body, html {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>

<script>
AFRAME.registerComponent('drag-rotate', {
  schema: {
    speed: { default: 200 }
  },

  init: function () {
    this.isDown = false;
    this.startX = 0;
    this.rotation = this.el.getAttribute('rotation');

    this.el.sceneEl.addEventListener('touchstart', (e) => {
      this.isDown = true;
      this.startX = e.touches[0].pageX;
    });

    this.el.sceneEl.addEventListener('touchend', () => {
      this.isDown = false;
    });

    this.el.sceneEl.addEventListener('touchmove', (e) => {
      if (!this.isDown) return;

      let deltaX = e.touches[0].pageX - this.startX;
      this.startX = e.touches[0].pageX;

      this.rotation.y += deltaX / this.data.speed;
      this.el.setAttribute('rotation', this.rotation);
    });
  }
});
</script>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: true"
>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

<a-entity mindar-image-target="targetIndex: 0">

  <a-entity position="0 0.2 0" scale="0.5 0.5 0.5">

    <a-gltf-model
      src="scene.glb"
      rotation="0 180 0"
      drag-rotate
    ></a-gltf-model>

  </a-entity>

</a-entity>

</a-scene>

</body>
</html>
